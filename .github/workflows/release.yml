name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches extension version
        shell: bash
        run: |
          set -euo pipefail
          build_file="src/all/randomdownloads/build.gradle.kts"
          lib_version=$(grep -E '^[[:space:]]*libVersion[[:space:]]*=' "$build_file" | sed -E 's/.*"([^"]+)".*/\1/')
          version_code=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' "$build_file" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          expected_tag="v${lib_version}.${version_code}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match extension version $expected_tag"
            exit 1
          fi

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signingkey.jks

      - name: Check formatting and build release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :src:all:randomdownloads:spotlessCheck :src:all:randomdownloads:assembleRelease --no-daemon --console=plain

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src/all/randomdownloads/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          expected_sha256="7cd1d91e9ea01b75d3380c10134869f0dfdf173c53cebb898060ede6464df571"
          actual_sha256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "Unexpected signing certificate: $actual_sha256"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(find src/all/randomdownloads/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f signingkey.jks